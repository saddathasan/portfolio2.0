# Cloudflare Pages configuration for React Portfolio
name = "portfolio-site"
compatibility_date = "2024-11-01"

# Pages configuration
[env.production]
compatibility_date = "2024-11-01"

# Environment variables (set these in Cloudflare Dashboard)
# GITHUB_TOKEN = "..."   # Phase 3: server-side git-profile proxy (functions/api/github.ts)

# Build configuration
[build]
command = "npm run build"
publish = "dist"

# Pages build output directory
pages_build_output_dir = "dist"

# Functions configuration
[functions]
directory = "functions"

# Development configuration
[dev]
port = 8788
local_protocol = "http"